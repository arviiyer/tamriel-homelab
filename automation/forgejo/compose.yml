x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_DB: forgejo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ./db:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, forgejo, -d, forgejo]
      interval: 5s
      timeout: 5s
      retries: 20

  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.9@sha256:91a5310c86934339e16bd06b6078aada836e3d8935b2d70f6598108cbfaed5d1
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      TZ: ${TZ:-Etc/UTC}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      FORGEJO__server__DOMAIN: ${DOMAIN:?set DOMAIN}
      FORGEJO__server__ROOT_URL: ${ROOT_URL:?set ROOT_URL}
      FORGEJO__server__SSH_DOMAIN: ${DOMAIN:?set DOMAIN}
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: ${OIDC_AUTO_REGISTRATION:-false}
      FORGEJO__mailer__ENABLED: "false"
    volumes:
      - ./data:/data
    ports:
      - "${FORGEJO_BIND_IP:-127.0.0.1}:3000:3000"
      - "${FORGEJO_BIND_IP:-127.0.0.1}:2222:2222"
