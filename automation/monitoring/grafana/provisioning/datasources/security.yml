apiVersion: 1
prune: true
datasources:
  - name: Security Prometheus
    uid: security-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.example.com:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
  - name: Security Loki
    uid: security-loki
    type: loki
    access: proxy
    url: http://loki.example.com:3100
    editable: false
    jsonData:
      maxLines: 1000
