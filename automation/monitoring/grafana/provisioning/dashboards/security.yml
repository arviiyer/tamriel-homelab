apiVersion: 1
providers:
  - name: security-evidence
    orgId: 1
    folder: Security
    folderUid: security-evidence
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/security
      foldersFromFilesStructure: false
