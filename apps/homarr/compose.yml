services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:v1.77.2@sha256:d60120a04536ded5d8c3a478192dca549c3f16cae2f809ab094f95f011bb74e6
    restart: unless-stopped
    ports:
      - "127.0.0.1:7575:7575"
    environment:
      TZ: Etc/UTC
      AUTH_PROVIDERS: credentials
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?Generate a key in .env before starting Homarr}
    volumes:
      - appdata:/appdata
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  appdata:
