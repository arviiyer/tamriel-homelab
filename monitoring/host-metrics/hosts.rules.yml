groups:
  - name: hosts
    rules:
      - alert: HostUnavailable
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.host }} cannot be scraped'
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 10m
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.host }} has less than 15% memory available'
      - alert: HostRootSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.host }} has less than 15% root space available'
