services:
  feed:
    image: python:3.13-slim-bookworm@sha256:5024f48ba9441d4b13a95d3945abc6365538e3a31109833367a1923523c6efed
    restart: unless-stopped
    user: "1000:1000"
    command: [python3, -B, /app/serve.py, --bind, 0.0.0.0, --port, "8080", --directory, /public]
    volumes:
      - ./serve.py:/app/serve.py:ro
      - ./data/public:/public:ro
    ports: ["127.0.0.1:8094:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [briefing]
    logging:
      options: {max-size: 5m, max-file: "2"}
  model:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:970168341efef973da5666ea5c362fa428ee66ba0dfa621b0f69bf3feb3320f7
    profiles: [inference]
    restart: "no"
    user: "1000:1000"
    command: [--model, /models/Qwen3.5-4B-Q4_K_M.gguf, --alias, reading-summary,
      --host, 0.0.0.0, --port, "8080", --ctx-size, "8192", --parallel, "1",
      --reasoning, "off", --threads, "4", --threads-batch, "4", --flash-attn, "on",
      --cache-type-k, q8_0, --cache-type-v, q8_0, --n-gpu-layers, "0", --no-webui]
    volumes: ["./models:/models:ro"]
    ports: ["127.0.0.1:8092:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,noexec,nosuid,nodev"]
    cpus: 4.0
    mem_limit: 4608m
    memswap_limit: 4608m
    logging:
      options: {max-size: 5m, max-file: "2"}
networks:
  briefing: {}
