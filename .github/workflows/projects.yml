name: Project examples

on:
  pull_request:
    paths: ['projects/**', '.github/workflows/projects.yml']
  push:
    branches: [main]
    paths: ['projects/**', '.github/workflows/projects.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test Python projects
        run: |
          python3 -m unittest discover -s projects/printer-monitor/tests -v
          python3 -m unittest discover -s projects/reading-brief/tests -v
          python3 projects/printer-monitor/printer_monitor.py --demo --status
          python3 projects/reading-brief/brief.py demo --profile projects/reading-brief/profile.example.json --input projects/reading-brief/articles.example.ndjson --data "$RUNNER_TEMP/brief-demo"
          shellcheck projects/printer-monitor/install.sh projects/reading-brief/run-brief.sh
          docker compose -f projects/reading-brief/compose.yml config --quiet
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        project: [forge, seerr-discord-approver]
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: projects/${{ matrix.project }}/go.sum
          cache: ${{ matrix.project != 'forge' }}
      - run: |
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l ./*.go)"
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - run: bash projects/forge/check-terraform.sh
