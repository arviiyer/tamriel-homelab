name: Project examples

on:
  pull_request:
    paths: ['projects/**', '.github/workflows/projects.yml']
  push:
    branches: [main]
    paths: ['projects/**', '.github/workflows/projects.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test Python projects
        run: |
          python3 -m unittest discover -s projects/printer-monitor/tests -v
          python3 projects/printer-monitor/printer_monitor.py --demo --status
          shellcheck projects/printer-monitor/install.sh
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        project: [seerr-discord-approver]
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: projects/${{ matrix.project }}/go.sum
          cache: true
      - run: |
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l ./*.go)"
