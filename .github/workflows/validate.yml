name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-safety:
    name: Links and publication rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check public content boundary
        run: bash scripts/check-public-safety.sh

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check Markdown links
        run: python3 scripts/check-markdown-links.py

      - name: Check validation scripts
        run: |
          python3 -m compileall -q scripts tests
          shellcheck scripts/check-public-safety.sh

      - name: Check whitespace across history
        run: git log --check --oneline --all

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          actual=$(sha256sum "$archive")
          test "${actual%% *}" = "$GITLEAKS_SHA256"
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan complete Git history
        run: >-
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
