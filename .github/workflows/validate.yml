name: Validate public portfolio

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-safety:
    name: Publication safety
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python3 -m pip install --requirement automation/trivy/requirements.txt
          python3 -m pip install --requirement automation/ansible/requirements.txt
          python3 -m pip install --requirement automation/ci/requirements.txt
          python3 -m pip install --requirement automation/falco/requirements.txt
          python3 -m pip install --requirement automation/monitoring/requirements.txt

      - name: Check public content boundary
        run: bash scripts/check-public-safety.sh

      - name: Check Markdown links
        run: python3 scripts/check-markdown-links.py

      - name: Check Python syntax
        run: >-
          python3 -m py_compile
          scripts/check-markdown-links.py
          automation/trivy/delta.py
          automation/trivy/extract_images.py
          automation/trivy/tests/test_delta.py
          automation/trivy/tests/test_extract_images.py
          automation/trivy/tests/test_scan_integration.py
          automation/ansible/tests/test_policy.py
          automation/ansible/tests/render_apt_candidates.py
          automation/ansible/tests/check_apt_candidates.py
          automation/ci/target/restricted_deploy.py
          automation/ci/tests/test_restricted_deploy.py
          automation/ci/tests/test_workflow_policy.py
          automation/falco/tests/render_config.py
          automation/falco/tests/test_policy.py
          automation/monitoring/tests/test_dashboard.py
          automation/monitoring/tests/validate_grafana.py
          automation/recovery/restore.py
          automation/recovery/tests/archive_factory.py
          automation/recovery/tests/test_restore.py
          automation/recovery/tests/test_systemd_policy.py
          automation/recovery/tests/run_isolated_restore_drill.py

      - name: Run Trivy pipeline tests
        run: >-
          python3 -m unittest discover
          -s automation/trivy/tests
          -p 'test_*.py'
          -v

      - name: Run Ansible policy tests
        run: >-
          python3 -m unittest discover
          -s automation/ansible/tests
          -p 'test_*.py'
          -v

      - name: Run delivery policy and transaction tests
        run: >-
          python3 -m unittest discover
          -s automation/ci/tests
          -p 'test_*.py'
          -v

      - name: Check restricted deployment endpoint policy
        run: |
          if ! command -v sshd >/dev/null || ! command -v visudo >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends openssh-server sudo
          fi
          bash automation/ci/tests/validate_target.sh

      - name: Build disposable delivery drill target
        run: bash automation/ci/tests/run_disposable_host_drill.sh --build-only

      - name: Run Falco policy tests
        run: >-
          python3 -m unittest discover
          -s automation/falco/tests
          -p 'test_*.py'
          -v

      - name: Run monitoring dashboard tests
        run: >-
          python3 -m unittest discover
          -s automation/monitoring/tests
          -p 'test_*.py'
          -v

      - name: Run recovery policy and restore tests
        run: >-
          python3 -m unittest discover
          -s automation/recovery/tests
          -p 'test_*.py'
          -v

      - name: Run isolated synthetic restore drill
        run: python3 automation/recovery/tests/run_isolated_restore_drill.py

      - name: Check storage-readiness service policy
        run: >-
          systemd-analyze verify --recursive-errors=no
          automation/recovery/systemd/example-storage-dependent.service

      - name: Check Ansible inventory and playbooks
        working-directory: automation/ansible
        run: |
          ansible-playbook --syntax-check playbooks/site.yml
          ansible-playbook --syntax-check playbooks/controlled-upgrade.yml
          ansible-inventory --host pve-01 > "$RUNNER_TEMP/pve-01.json"
          ansible-inventory --host apps-01 > "$RUNNER_TEMP/apps-01.json"
          python3 - "$RUNNER_TEMP/pve-01.json" "$RUNNER_TEMP/apps-01.json" <<'PY'
          import json
          import pathlib
          import sys

          pve = json.loads(pathlib.Path(sys.argv[1]).read_text())
          apps = json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert pve["ansible_user"] == "root"
          assert pve["ssh_permit_root_login"] == "prohibit-password"
          assert pve["ssh_allowed_users"] == ["root"]
          assert apps["ansible_user"] == "operator"
          assert apps["ssh_permit_root_login"] == "no"
          assert apps["ssh_allowed_users"] == ["operator"]
          PY

      - name: Check Falco deployment playbook
        working-directory: automation/falco
        run: ansible-playbook --syntax-check playbooks/falco.yml

      - name: Check Falco configuration, rules, and event router
        run: |
          rendered="$RUNNER_TEMP/falco.yaml"
          python3 automation/falco/tests/render_config.py "$rendered"
          docker run --rm \
            -v "$rendered:/tmp/falco.yaml:ro" \
            -v "$PWD/automation/falco/roles/falco/files/falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro" \
            --entrypoint falco \
            falcosecurity/falco@sha256:d0cfe422d6ac0e0f20857798f46c7d7273210e1b064b22821e4e6e7f843cde6b \
            --dry-run -c /tmp/falco.yaml \
            -r /etc/falco/falco_rules.yaml \
            -r /etc/falco/falco_rules.local.yaml
          docker compose \
            --env-file automation/falco/falcosidekick/environment.example \
            -f automation/falco/falcosidekick/compose.yml \
            config --quiet

      - name: Check Grafana provisioning and dashboard loading
        run: python3 automation/monitoring/tests/validate_grafana.py

      - name: Check Debian apt policy compatibility
        run: |
          output="$RUNNER_TEMP/apt-policy"
          python3 automation/ansible/tests/render_apt_candidates.py "$output"
          docker run --rm -v "$output:/candidate:ro" \
            debian@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258 \
            sh -lc '
              cp /candidate/50unattended-upgrades /run/50unattended-upgrades
              cp /candidate/20auto-upgrades /run/20auto-upgrades
              apt-config -o Dir::Etc::parts=/dev/null \
                -c /run/50unattended-upgrades dump
              apt-config -o Dir::Etc::parts=/dev/null \
                -c /run/20auto-upgrades dump
            ' > "$RUNNER_TEMP/apt-policy-effective.txt"
          python3 automation/ansible/tests/check_apt_candidates.py \
            < "$RUNNER_TEMP/apt-policy-effective.txt"

      - name: Check shell scripts
        run: >-
          docker run --rm
          -v "$PWD:/mnt:ro"
          --entrypoint shellcheck
          koalaman/shellcheck-alpine@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
          /mnt/automation/trivy/scan.sh
          /mnt/automation/ci/tests/validate_target.sh
          /mnt/automation/ci/tests/run_disposable_host_drill.sh
          /mnt/automation/ci/tests/disposable_host_drill.sh
          /mnt/scripts/check-public-safety.sh

      - name: Check Prometheus rules
        run: >-
          docker run --rm
          -v "$PWD:/workspace:ro"
          --entrypoint promtool
          prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
          check rules
          /workspace/automation/trivy/prometheus-rules.yml

      - name: Check Trivy CLI compatibility
        run: |
          image="aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c"
          output="$RUNNER_TEMP/trivy-compat"
          mkdir -p "$output/current"
          docker run --rm -v "$PWD:/workspace:ro" -v "$output:/out" "$image" config \
            --exit-code 0 \
            --format json \
            --output /out/current/apps-misconfig.json \
            --quiet \
            /workspace/automation/trivy/tests/fixtures
          docker run --rm -v "$PWD:/workspace:ro" -v "$output:/out" "$image" repo \
            --scanners secret \
            --exit-code 0 \
            --format json \
            --output /out/current/apps-secret.json \
            --quiet \
            /workspace/automation/trivy/tests/fixtures
          docker run --rm -v "$output:/out" "$image" image \
            --scanners vuln \
            --exit-code 0 \
            --format json \
            --output /out/current/apps--alpine-vuln.json \
            --quiet \
            --timeout 10m \
            alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          python3 automation/trivy/delta.py report \
            --current-dir "$output/current" \
            --last-dir "$output/missing-baseline" \
            --repositories automation/trivy/tests/fixtures/repositories.tsv \
            --output "$output/findings.prom" \
            --report-output "$output/current/_delta-report.json" \
            --manifest-output "$output/current/_baseline.json" \
            --initialize-baseline

      - name: Check whitespace across history
        run: git log --check --oneline --all

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
