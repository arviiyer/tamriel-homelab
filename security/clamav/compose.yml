services:
  clamav:
    image: clamav/clamav:1.5.1_base@sha256:1e919d610263430fa721fb01dd9014d04bd1a58da7e07f899fccada2ca2274e8
    restart: unless-stopped
    mem_limit: 2560m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMAV_NO_CLAMD: "false"
    volumes:
      - type: bind
        source: ${SCAN_PATH:?Set SCAN_PATH to an existing directory}
        target: /scan
        read_only: true
        bind:
          create_host_path: false
      - signatures:/var/lib/clamav
    healthcheck:
      test: [CMD, clamdscan, --ping, "3"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  signatures:
