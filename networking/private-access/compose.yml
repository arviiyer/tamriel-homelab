services:
  caddy:
    build: .
    image: tamriel-caddy-example:local
    restart: unless-stopped
    # Linux host networking preserves LAN/Tailscale client source addresses.
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
volumes:
  caddy-data:
  caddy-config:
