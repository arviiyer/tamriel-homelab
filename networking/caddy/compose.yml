services:
  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    # The image's binary carries this file capability, even for high ports.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - example
      - access
    depends_on:
      - upstream

  upstream:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./upstream.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - example

networks:
  access: {}
  example:
    internal: true
